<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bienvenido — Entre Paréntesis</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    /* --- Fullscreen carousel + images --- */
    html, body { height: 100%; margin: 0; }
    .welcome-carousel,
    .welcome-carousel .carousel-inner,
    .welcome-carousel .carousel-item {
      height: 100vh;
    }
    .welcome-carousel .carousel-item img {
      height: 100vh;
      width: 100%;
      object-fit: cover;
      display: block;
    }

    /* Overlay central */
    .welcome-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none; /* que no interfiera con swipe del carousel */
      z-index: 1075;
    }
    .welcome-box {
      pointer-events: auto;
      background: rgba(6, 8, 6, 0.52); /* ligeramente más oscuro para contraste */
      color: #fff;
      padding: 2rem 2.4rem;
      border-radius: 12px;
      text-align: center;
      backdrop-filter: blur(6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.32);
      max-width: 900px;
      width: calc(100% - 3rem);
    }
    .welcome-box h1 { font-size: clamp(1.6rem, 3.6vw, 2.6rem); margin-bottom: .35rem; }
    .welcome-box p { margin-bottom: 1rem; opacity: .95; }

    /* Top-right small control buttons */
    .top-controls {
      position: fixed;
      right: 1rem;
      top: 1rem;
      z-index: 1085;
      display: flex;
      gap: .5rem;
    }

    /* Make controls visible on dark background */
    .top-controls .btn { opacity: .95; }

    /* Carousel controls (prev/next) slightly bigger for full-screen */
    .welcome-carousel .carousel-control-prev-icon,
    .welcome-carousel .carousel-control-next-icon {
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
      width: 44px;
      height: 44px;
    }

    /* Hide the footer on the welcome page so the image truly fills the screen */
    footer { display: none !important; }

    /* Mobile tweak */
    @media (max-width: 575px) {
      .welcome-box { padding: 1.1rem; border-radius: 10px; }
      .top-controls { right: .6rem; top: .6rem; }
      .welcome-carousel .carousel-control-prev-icon,
      .welcome-carousel .carousel-control-next-icon { width:36px; height:36px; }
    }

    /* Respect reduced motion if needed */
    @media (prefers-reduced-motion: reduce) {
      .welcome-carousel { scroll-behavior: auto; }
    }
  </style>
</head>
<body class="bg-dark">

  <!-- Top-right non-functional buttons -->
  <div class="top-controls">
    <button class="btn btn-outline-light btn-sm" type="button" aria-label="Iniciar sesión (no funcional)">Iniciar sesión</button>
    <button class="btn btn-light btn-sm" type="button" aria-label="Crear cuenta (no funcional)">Crear cuenta</button>
  </div>

  <!-- Carrusel full-screen -->
  <div id="welcomeCarousel" class="carousel slide carousel-fade welcome-carousel" data-bs-ride="carousel" data-bs-interval="6000">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="imagenes/latte.png" alt="Entre Paréntesis — latte" loading="eager" data-no-lazy>
      </div>
      <div class="carousel-item">
        <img src="imagenes/coldbrew.png" alt="Entre Paréntesis — cold brew" loading="lazy">
      </div>
      <div class="carousel-item">
        <img src="imagenes/espresso.png" alt="Entre Paréntesis — espresso" loading="lazy">
      </div>
      <!-- si tienes más imágenes, añade más carousel-item -->
    </div>

    <!-- Overlay central con mensaje e ingresar -->
    <div class="welcome-overlay">
      <div class="welcome-box reveal">
        <h1 class="fw-bold">Bienvenido a <span class="bracket">Entre Paréntesis</span></h1>
        <p class="lead">Un espacio minimalista, cálido y moderno para tu (merecido) momento.</p>
        <div class="d-flex justify-content-center gap-3">
          <!-- Ingresar lleva a la página principal "inicio.html" -->
          <a href="inicio.html" class="btn btn-lg btn-primary">Ingresar</a>
          <a href="inicio.html" class="btn btn-outline-light btn-lg">Explorar</a>
        </div>
      </div>
    </div>

    <!-- Controles (prev/next) -->
    <button class="carousel-control-prev" type="button" data-bs-target="#welcomeCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Anterior</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#welcomeCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Siguiente</span>
    </button>
  </div>

  <!-- Hidden small footer (kept in DOM but hidden) -->
  <footer class="position-fixed bottom-0 start-0 w-100 text-center pb-3" style="z-index:1083">
    <small class="text-white-50">© <span id="year"></span> Entre Paréntesis</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/animacion.js"></script>
</body>
</html>
