<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto — Entre Paréntesis</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="inicio.html">
        <img src="imagenes/EntreParentesis_Logo.png" height="28" alt="logo"> Entre Paréntesis
      </a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navContacto"><span class="navbar-toggler-icon"></span></button>
      <div id="navContacto" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="productos.html">Menú</a></li>
          <li class="nav-item"><a class="nav-link" href="acerca.html">Acerca</a></li>
          <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="py-5 section-soft">
    <div class="container text-center">
      <h1 class="fw-bold text-green">Contacto</h1>
      <p class="mb-0">Estamos listos para tu (momento).</p>
    </div>
  </header>

  <main class="py-5">
    <div class="container">
      <div class="row g-4">
        <div class="col-lg-6">
          <form class="p-4 border rounded-4 bg-white">
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" placeholder="Tu nombre" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" placeholder="tucorreo@ejemplo.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Asunto</label>
              <input type="text" class="form-control" placeholder="Motivo del mensaje" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Mensaje</label>
              <textarea class="form-control" rows="5" placeholder="Cuéntanos..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">
              <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
              Enviar
            </button>
            
          </form>
        </div>

        <div class="col-lg-6">
          <div class="p-4 border rounded-4 section-soft h-100">
            <h5 class="text-green">Información</h5>
            <p class="mb-1"><i class="bi bi-geo-alt me-2"></i>Calle Café 123, Col. Centro</p>
            <p class="mb-1"><i class="bi bi-telephone me-2"></i>+52 55 0000 0000</p>
            <p class="mb-3"><i class="bi bi-envelope me-2"></i>contacto@entreparentesis.mx</p>
            <!-- Usamos el logo como placeholder de mapa -->
            <div class="ratio ratio-16x9 mb-3">
              <img src="imagenes/EntreParentesis_Logo-removebg-preview.png" class="w-100 h-100 object-fit-cover rounded-3" alt="Ubicación">
            </div>
            <div class="alert alert-success" role="alert">
              <i class="bi bi-clock me-2"></i>Lunes a Sábado: 8:00–21:00 · Domingo: 9:00–19:00
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
      <small>© <span id="year"></span> Entre Paréntesis</small>
      <div class="d-flex gap-3">
        <a class="text-white text-decoration-none" href="#"><i class="bi bi-instagram"></i></a>
        <a class="text-white text-decoration-none" href="#"><i class="bi bi-facebook"></i></a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/animacion.js"></script>
</body>
</html>
